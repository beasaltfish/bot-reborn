<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/admin/src/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device laboratory</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #eee7dc; background: #29231e; font: 15px/1.5 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); min-height: 100vh; }
    #stage { width: 100%; height: 100vh; touch-action: none; }
    aside { padding: 24px; background: #1f1913; overflow: auto; }
    a { color: #f0b46a; } h1 { font-size: 22px; } h2 { margin-top: 28px; font-size: 16px; }
    ul { padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .lab-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .lab-actions button { min-height: 44px; padding: 8px 12px; cursor: pointer; }
    .lesson-panel { margin-top: 24px; padding: 12px; border: 1px solid #756758; border-radius: 8px; }
    .lesson-panel h2 { margin-top: 0; }
    .lesson-panel nav { display: flex; gap: 8px; }
    .lesson-panel button { min-height: 44px; padding: 8px 12px; cursor: pointer; }
    .lesson-panel li { margin-bottom: 10px; }
    .lesson-panel li button { display: block; margin-top: 4px; }
    .pin { padding: 6px 10px; color: #eee7dc; background: #40362d; border: 1px solid #756758; border-radius: 8px; cursor: pointer; }
    .pin[aria-pressed="true"] { color: #21170b; background: #f0b46a; }
    .bme280-panel label, .button-lab-panel label, #led-experiment label { display: block; margin: 10px 0; }
    .button-lab-panel button, .sonar-lab-panel button { min-height: 44px; padding: 8px 12px; }
    .sonar-lab-panel label { display: block; margin: 10px 0; }
    .sonar-lab-panel input { display: block; width: 100%; }
    .bme280-panel input { width: 95px; padding: 5px; }
    #led-experiment input[type="number"] { width: 95px; padding: 5px; }
    .muted { color: #bdb4a9; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } #stage { height: 55vh; } }

    #pin-callout {
      position: fixed; z-index: 6; max-width: min(240px, calc(100vw - 32px));
      transform: translate(14px, -50%); pointer-events: none;
      padding: 7px 10px; border-radius: 9px;
      font: 500 12px/1.4 var(--font, ui-sans-serif, system-ui, sans-serif); color: #f6eee3;
      background: rgba(36, 28, 21, 0.92); border: 1px solid rgba(255, 240, 220, 0.24);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <main>
    <canvas id="stage" aria-label="Interactive 3D device model"></canvas>
    <aside>
      <a href="./">← Back to workbench</a>
      <label for="language">Language / 语言</label>
      <select id="language"><option value="en">English</option><option value="zh">中文</option></select>
      <h1 id="name">Device laboratory</h1>
      <p id="summary" class="muted"></p>
      <p id="instructions" class="muted">Drag to rotate · scroll to zoom</p>
      <h2 id="pins-title">Pins</h2>
      <ul id="pins"></ul>
      <p id="pin-detail" role="status" class="muted">Select a pin to locate it on the model.</p>
      <section id="guide" hidden><h2 id="guide-title"></h2><ol id="guide-steps"></ol></section>
      <section id="led-experiment" hidden>
        <h2 id="experiment-title"></h2>
        <label><span id="voltage-label"></span> <input id="voltage" type="number" min="0" max="12" step="0.1" value="5"> V</label>
        <label><span id="resistance-label"></span> <input id="resistance" type="number" min="0" max="10000000" step="1" value="220"> Ω</label>
        <label><input id="reversed" type="checkbox"> <span id="reversed-label"></span></label>
        <p id="experiment-result" role="status"></p>
      </section>
      <p id="status" role="status"></p>
    </aside>
  </main>
  <script type="module" src="./lab.js"></script>
</body>
</html>
