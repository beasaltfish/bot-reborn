<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiring Simulator</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2b241e; }
    #bench { display: block; width: 100vw; height: 100vh; touch-action: none; }
    :root {
      --ink: #f6eee3;
      --ink-dim: rgba(246, 238, 227, 0.62);
      --glass: rgba(36, 28, 21, 0.62);
      --glass-strong: rgba(36, 28, 21, 0.86);
      --edge: rgba(255, 240, 220, 0.18);
      --accent: #f0b46a;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* Every control on the page shares one look: a small dark glass pill. */
    #views, .pill {
      padding: 7px 14px;
      font: 600 13px/1 var(--font);
      letter-spacing: 0.02em;
      color: var(--ink); background: var(--glass);
      border: 1px solid var(--edge); border-radius: 999px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    button.pill { cursor: pointer; }
    button.pill:hover { background: rgba(36, 28, 21, 0.8); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* The three views side by side: one press to any of them, the current one lit. */
    #viewbox { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    #views { display: flex; gap: 2px; padding: 3px; }
    #views button {
      padding: 4px 11px; border: 0; border-radius: 999px; cursor: pointer;
      font: inherit; letter-spacing: inherit; color: var(--ink-dim); background: transparent;
    }
    #views button:hover { color: var(--ink); }
    #views button[aria-pressed="true"] { color: #2a2018; background: var(--accent); }
    #peek { font: 500 11px/1 var(--font); color: var(--ink-dim); padding-right: 6px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
    [hidden] { display: none !important; }

    #tools { position: fixed; top: 14px; left: 14px; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100vw - 120px); }
    .pill.confirm { display: inline-flex; align-items: center; gap: 10px; background: var(--glass-strong); }
    .language-control { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; color: var(--ink); background: var(--glass); border: 1px solid var(--edge); font: 600 12px var(--font); }
    .language-control select { color: var(--ink); background: #40362d; border: 1px solid var(--edge); border-radius: 5px; padding: 3px; }
    .link {
      padding: 0; border: 0; background: none; cursor: pointer;
      font: 600 13px/1 var(--font); color: var(--accent);
    }
    .link:hover { text-decoration: underline; }
    .link.danger { color: #ff8a76; }


    #runtime {
      position: fixed; right: 14px; bottom: 14px; width: min(300px, calc(100vw - 28px)); box-sizing: border-box;
      padding: 12px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
      font: 500 13px/1.35 var(--font); color: var(--ink);
      background: var(--glass-strong); border: 1px solid var(--edge);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #runtime h2 { margin: 0; font: 600 13px/1.2 var(--font); }
    #runtime label { display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 8px; }
    #runtime input[type="range"] { width: 100%; }
    #runtime input[type="checkbox"] { justify-self: start; }
    #runtime select { font: 500 12px var(--font); color: var(--ink); background: #40362d; border: 1px solid var(--edge); border-radius: 6px; padding: 3px; }
    #runtime output { min-width: 38px; text-align: right; color: var(--ink-dim); }

    #hint {
      position: fixed; top: 52px; left: 14px; max-width: min(420px, calc(100vw - 28px));
      padding: 10px 14px; border-radius: 12px;
      font: 500 13px/1.45 var(--font); color: var(--ink);
      background: var(--glass-strong); border: 1px solid var(--edge);
    }

    #wire {
      position: fixed; top: 52px; left: 14px; width: min(340px, calc(100vw - 28px)); box-sizing: border-box;
      padding: 12px 16px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
      font: 500 13px/1.45 var(--font); color: var(--ink);
      background: #1f1913; border: 1px solid var(--edge);
    }
    #wire[hidden], #runbar[hidden] { display: none; }
    #wire header { display: flex; align-items: center; justify-content: space-between; }
    #wire h2 { margin: 0; font: 600 14px/1.2 var(--font); }
    #wire .close { border: 0; background: none; color: var(--ink-dim); font: 400 22px/1 var(--font); cursor: pointer; padding: 2px 6px; }
    #wire .close:hover { color: var(--ink); }
    #wire .opt { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    #wire select {
      font: 500 13px/1.2 var(--font); color: var(--ink); background: rgba(255, 240, 220, 0.06);
      border: 1px solid var(--edge); border-radius: 8px; padding: 6px 8px;
    }
    #wire .go { display: flex; gap: 8px; }
    #wire .go .pill { cursor: pointer; }
    #runbar {
      position: fixed; left: 50%; top: 52px; transform: translateX(-50%);
      /* A fixed width, not a max: the words change every step, and a bar that
         grows with them slides Skip out from under the pointer. */
      width: min(760px, calc(100vw - 32px)); box-sizing: border-box;
      display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 999px;
      font: 500 13px/1.3 var(--font); color: var(--ink);
      background: var(--glass-strong); border: 1px solid var(--edge);
    }
    #runbar .say { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #runbar .link { flex: none; }
    #runbar .pace { display: flex; gap: 2px; flex: none; }
    #runbar .pace .link { padding: 3px 5px; border-radius: 6px; color: var(--ink-dim); }
    #runbar .pace .link:hover { text-decoration: none; color: var(--ink); }
    #runbar .pace .link[aria-pressed="true"] { color: var(--ink); background: rgba(255, 240, 220, 0.16); }

    #status {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      max-width: calc(100vw - 32px); box-sizing: border-box;
      padding: 8px 16px; border-radius: 999px;
      font: 500 13px/1.2 var(--font); color: var(--ink);
      background: var(--glass-strong); border: 1px solid var(--edge);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #status a { color: var(--accent); }

    #picker {
      /* Off to the side, so the bench it is about stays in sight. */
      position: fixed; top: 56px; right: 14px;
      width: min(320px, calc(100vw - 28px)); box-sizing: border-box;
      padding: 14px; border-radius: 14px;
      font: 500 13px/1.3 var(--font); color: var(--ink);
      background: var(--glass-strong); border: 1px solid var(--edge);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 10px;
    }
    #picker .head { font-weight: 600; }
    #picker .choices { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; }
    #picker .choice {
      display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
      padding: 9px 12px; border-radius: 10px; text-align: left; cursor: pointer;
      font: 600 13px/1.2 var(--font); color: var(--ink);
      background: rgba(255, 240, 220, 0.06); border: 1px solid var(--edge);
    }
    #picker .choice:hover:not([disabled]) { background: rgba(240, 180, 106, 0.16); border-color: rgba(240, 180, 106, 0.5); }
    #picker .choice[disabled] { cursor: default; opacity: 0.55; }
    #picker .why { font-weight: 500; font-size: 12px; color: var(--ink-dim); }
    #picker > .link { align-self: flex-end; }

    #partsbin {
      position: fixed; top: 56px; left: 14px; bottom: 14px;
      width: min(300px, calc(100vw - 28px)); box-sizing: border-box; overflow: auto;
      padding: 14px 16px 18px; border-radius: 14px;
      font: 500 13px/1.4 var(--font); color: var(--ink);
      background: #1f1913; border: 1px solid var(--edge);
    }
    #partsbin header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    #partsbin h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    #partsbin .close { border: 0; background: none; color: var(--ink-dim); font: 400 22px/1 var(--font); cursor: pointer; padding: 2px 6px; }
    #partsbin .close:hover { color: var(--ink); }
    #partsbin .items { display: grid; gap: 6px; }
    #wire-menu { position: fixed; z-index: 5; display: flex; flex-wrap: wrap; box-sizing: border-box; max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); overflow-y: auto; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 12px; color: var(--ink); background: var(--glass-strong); border: 1px solid var(--edge); font: 12px var(--font); }
    #wire-menu .swatch { width: 20px; height: 20px; border: 2px solid #aaa; border-radius: 50%; cursor: pointer; }
    #selection-context { position: fixed; z-index: 5; top: 64px; right: 16px; display: flex; flex-wrap: wrap; box-sizing: border-box; overflow: auto; align-items: center; gap: 7px; max-width: min(290px, calc(100vw - 16px)); max-height: calc(100vh - 16px); padding: 10px; border-radius: 12px; color: var(--ink); background: var(--glass-strong); border: 1px solid var(--edge); font: 12px var(--font); }
    #selection-context strong, #selection-context div { flex-basis: 100%; }
    #selection-context button[data-color] { width: 24px; height: 24px; border: 2px solid #aaa; border-radius: 50%; cursor: pointer; }
    #selection-context button[data-color][aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
    #wire-menu .bme280-panel { flex-basis: 100%; max-width: 300px; }
    #wire-menu .bme280-panel label { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0; }
    #wire-menu input[type="number"] { width: 76px; padding: 4px; color: var(--ink); background: #40362d; border: 1px solid var(--edge); border-radius: 5px; }
    #partsbin input[type="search"] { box-sizing: border-box; width: 100%; margin-bottom: 10px; padding: 8px 10px; color: var(--ink); background: rgba(255,240,220,0.06); border: 1px solid var(--edge); border-radius: 8px; font: inherit; }
    #partsbin header button { border: 0; background: none; color: var(--ink-dim); font: 400 22px var(--font); cursor: pointer; }
    #partsbin [role="group"] { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    #partsbin button:not(.close) { cursor: pointer; color: var(--ink); background: rgba(255,240,220,0.06); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 7px; }
    #partsbin button[aria-pressed="true"] { border-color: var(--accent); background: rgba(240,180,106,0.2); }
    #partsbin article { display: flex; align-items: flex-start; gap: 10px; padding: 8px; margin: 6px 0; border: 1px solid var(--edge); border-radius: 8px; }
    #partsbin article .card-body { flex: 1 1 auto; min-width: 0; }
    #partsbin article img.thumb { flex: none; width: 64px; height: 64px; object-fit: contain; border-radius: 8px; background: rgba(255,240,220,0.06); }
    #partsbin article h4, #partsbin article p { margin: 0 0 5px; }
    #partsbin article p { color: var(--ink-dim); font-size: 12px; }
    #partsbin article button { margin-right: 4px; }
    #partsbin article button.star { border: 0; background: none; color: var(--accent); font-size: 17px; line-height: 1; padding: 2px 6px; }
    #partsbin article button.star[aria-pressed="false"] { color: var(--ink-dim); }
    #project-panel .project-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    #project-panel .project-tabs button { flex: 1; padding: 5px 8px; border: 1px solid var(--edge); border-radius: 7px; color: var(--ink-dim); background: rgba(255,240,220,0.06); font: 600 12px var(--font); cursor: pointer; }
    #project-panel .project-tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); background: rgba(240,180,106,0.18); }
    #project-panel [data-action="leave"] { margin-top: 10px; padding: 5px 9px; border: 1px solid var(--edge); border-radius: 7px; color: var(--accent); background: none; font: 600 12px var(--font); cursor: pointer; }
    #project-panel .project-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    #project-panel .project-heading span { color: var(--ink-dim); font: 600 11px/1.2 var(--font); white-space: nowrap; }
    #project-panel [data-missing="true"] { opacity: 0.75; }
    #project-panel .missing { display: block; margin-top: 4px; color: #ffb28a; font: 600 11px/1.3 var(--font); }
    #partsbin h3 { margin: 12px 0 4px; font-size: 13px; }
    #partsbin .section { margin: 10px 0 2px; color: var(--ink-dim); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    #partsbin .learn { color: var(--accent); font-size: 12px; margin: 0 0 4px 45px; }
    #partsbin button.part {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 7px 9px; border-radius: 10px; cursor: grab; touch-action: none;
      color: var(--ink); background: rgba(255, 240, 220, 0.05); border: 1px solid rgba(255, 240, 220, 0.14);
      font: inherit;
    }
    #partsbin button.part:hover { background: rgba(240, 180, 106, 0.14); border-color: rgba(240, 180, 106, 0.45); }
    #partsbin button.part:active { cursor: grabbing; }
    #partsbin button.part svg { flex: none; width: 26px; height: 18px; }
    #partsbin button.part svg rect, #partsbin button.part svg circle { fill: #2c5d3f; stroke: rgba(240, 240, 235, 0.5); stroke-width: 0.8; }
    #partsbin button.part .name { flex: 1 1 auto; }
    #partsbin button.part .note { color: var(--ink-dim); font-size: 11.5px; max-width: 48%; }

    #project-panel {
      position: fixed; top: 56px; left: 14px; bottom: 14px; z-index: 2;
      width: min(340px, calc(100vw - 28px)); box-sizing: border-box; overflow: auto;
      padding: 14px 16px 18px; border-radius: 14px; color: var(--ink);
      background: #1f1913; border: 1px solid var(--edge); font: 500 13px/1.4 var(--font);
    }
    #project-panel header { display: flex; align-items: center; justify-content: space-between; }
    #project-panel h2 { font-size: 15px; margin: 8px 0; }
    #project-panel h3 { font-size: 13px; margin: 10px 0 5px; }
    #project-panel select, #project-panel button { color: var(--ink); background: #40362d; border: 1px solid var(--edge); border-radius: 6px; padding: 5px 8px; }
    #project-panel button { cursor: pointer; }
    #project-panel ol { margin: 0; padding-left: 24px; }
    #project-panel li { padding: 8px 0; border-bottom: 1px solid var(--edge); }
    #project-panel li p { color: var(--ink-dim); margin: 4px 0; }
    #project-panel li[data-status="fault"] > span { color: #ff9788; }
    #project-panel li[data-status="complete"] > span { color: #96d9a6; }
    #diagram {
      position: fixed; top: 56px; left: 14px; bottom: 14px;
      width: min(700px, calc(100vw - 28px)); box-sizing: border-box; overflow: auto;
      padding: 14px 18px 18px; border-radius: 14px;
      font: 500 13px/1.45 var(--font); color: var(--ink);
      background: #1f1913; border: 1px solid var(--edge);
    }
    #diagram header { display: flex; align-items: center; justify-content: space-between; }
    #diagram h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    #diagram .close { border: 0; background: none; color: var(--ink-dim); font: 400 22px/1 var(--font); cursor: pointer; padding: 2px 6px; }
    #diagram .close:hover { color: var(--ink); }
    #diagram svg { display: block; width: 100%; height: auto; margin: 10px 0 4px; }
    #diagram svg .chip { fill: rgba(255, 240, 220, 0.05); stroke: rgba(255, 240, 220, 0.4); }
    #diagram svg .title { fill: var(--ink); font: 600 12px var(--font); text-anchor: middle; }
    #diagram svg .pin { fill: var(--ink-dim); font: 500 10.5px var(--font); }
    #diagram svg .dot { fill: var(--ink); }
    #diagram svg .num { fill: var(--ink-dim); font: 600 9.5px var(--font); }
    #diagram svg .wire { fill: none; stroke-width: 1.8; stroke-linejoin: round; opacity: 0.9; }
    #diagram svg .wire.power { stroke: #e2554a; }
    #diagram svg .wire.ground { stroke: #9a948c; }
    #diagram svg .wire.signal { stroke: #f2c230; }
    #diagram svg .junction.power { fill: #e2554a; }
    #diagram svg .junction.ground { fill: #9a948c; }
    #diagram svg .junction.signal { fill: #f2c230; }
    #diagram svg .wire.lit { stroke-width: 3.5; opacity: 1; stroke: var(--accent); }
    #diagram .note { margin: 0 0 6px; color: var(--ink-dim); }
    #diagram ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    #diagram li { display: flex; gap: 10px; padding: 5px 8px; border-radius: 8px; }
    #diagram li:hover { background: rgba(255, 240, 220, 0.06); }
    #diagram li .num { flex: none; width: 18px; color: var(--ink-dim); font-weight: 600; text-align: right; }
    #diagram li b { display: block; font-weight: 600; }
    #diagram li .why { color: var(--ink-dim); }
  </style>
</head>
<body>
  <canvas id="bench"></canvas>
  <div id="viewbox">
    <div id="views" role="group" aria-label="View">
      <button type="button" data-view="orbit" aria-pressed="false">Orbit</button>
      <button type="button" data-view="tilted" aria-pressed="false">Tilted</button>
      <button type="button" data-view="top" aria-pressed="false">Top</button>
    </div>
    <div id="peek"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
