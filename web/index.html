<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Voice robot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="shell">
  <main class="screen">

    <header class="topbar">
      <!-- Opens the settings sheet. The href survives as the no-JS fallback
           and as the route to the instrument page, which keeps the fixtures,
           the typed driver and the per-provider comparison the sheet does not
           carry; settings.js calls preventDefault() on every live click. -->
      <a id="settings" class="icon" href="setup.html" aria-label="Settings">⚙</a>
      <span id="link" class="link" hidden></span>
    </header>

    <section class="stage">
      <p id="bubble" class="bubble" hidden></p>

      <!-- The face is data-driven: robot.js writes data-eyes / data-antenna /
           data-waves / data-mouth / data-motion / data-tint onto #robot and the
           stylesheet picks the parts. Nothing here is generated by JS, so the
           drawing can be redrawn without touching code. -->
      <div id="robot" class="robot" data-face="SLEEPING" data-eyes="closed"
           data-antenna="off" data-waves="false" data-mouth="false"
           data-motion="breathe" data-tint="dim" role="img"
           aria-labelledby="robotLabel">
        <svg viewBox="0 0 120 134" class="robot-svg" aria-hidden="true">
          <g class="antenna">
            <line class="ink" x1="60" y1="20" x2="60" y2="32"/>
            <circle class="antenna-dot" cx="60" cy="14" r="6"/>
          </g>
          <rect class="ink" x="24" y="32" width="72" height="52" rx="14"/>

          <g class="eye-open">
            <circle cx="45" cy="58" r="7"/><circle cx="75" cy="58" r="7"/>
          </g>
          <g class="eye-closed">
            <path d="M37 58 q8 6 16 0"/><path d="M67 58 q8 6 16 0"/>
          </g>
          <g class="eye-up">
            <path d="M38 56 q7 -7 14 0"/><path d="M68 56 q7 -7 14 0"/>
          </g>
          <g class="eye-smile">
            <path d="M37 54 q8 -6 16 0"/><path d="M67 54 q8 -6 16 0"/>
          </g>

          <rect class="mouth" x="50" y="66" width="20" height="12" rx="4"/>

          <rect class="ink" x="33" y="90" width="54" height="24" rx="7"/>
          <circle class="ink wheel" cx="33" cy="120" r="10"/>
          <circle class="ink wheel" cx="87" cy="120" r="10"/>

          <!-- Shown only when no car is paired. It moves rather than sits
               still because "plug this in" is an instruction, and an
               instruction reads faster as a gesture than as a label. -->
          <g class="plug">
            <rect x="-4" y="96" width="16" height="12" rx="2"/>
            <line x1="12" y1="99" x2="30" y2="99"/>
            <line x1="12" y1="105" x2="30" y2="105"/>
          </g>

          <g class="wave">
            <path d="M12 48 q-5 10 0 20"/><path d="M5 42 q-7 16 0 32"/>
            <path d="M108 48 q5 10 0 20"/><path d="M115 42 q7 16 0 32"/>
          </g>
        </svg>
        <span id="robotLabel" class="sr-only" aria-live="polite"></span>

        <!-- The checklist, as the robot. Each band covers the region of the
             drawing that stands for one of steps.js's three steps: the head
             and the parts around it are what hearing and thinking look like,
             the body is the car, the wheels are left and right.

             Real buttons rather than clicks on the SVG: the dashed arcs are
             two pixels wide and a finger is not, and a shape inside an SVG is
             not something a screen reader can be handed. They are transparent
             and each is at least a finger tall; ui.js labels them. -->
        <button class="part" data-part="keys" type="button"></button>
        <button class="part" data-part="car" type="button"></button>
        <button class="part" data-part="steer" type="button"></button>
      </div>

      <!-- Asleep with the microphone shut and asleep waiting to hear its name
           are the same face, and they are not the same situation. §5.3 keeps
           KWS subscribed all through SLEEPING, so the second one really is
           listening — this line and the lit antenna say so. -->
      <p id="hint" class="hint" hidden></p>
      <p id="notice" class="notice" hidden></p>
    </section>

    <!-- Spec §4.1 layer 2. Layer 1 says of itself that it is not a safety
         mechanism, layer 3 waits for a timeout, and layer 0 only means anything
         once JS is already dead — so while JS is alive and doing the wrong
         thing, this is the only thing a person can do about it. Fixed position,
         red to itself, never moves: at the moment the car is about to get away
         the button has to be where the eyes already are. -->
    <button id="fab" class="fab" disabled></button>

    <footer class="tray">
      <button id="sleep" class="quiet" disabled></button>
    </footer>

    <pre id="log" class="log" hidden></pre>

    <!-- Spec §8 of the 2026-09-17 design: setup stops being a page. The rows
         are built by setup-sheet.js from the provider list, so the only thing
         written here is the frame — three layers is a fact about the config
         schema, not about this markup. -->
    <div id="setupSheet" class="sheet" hidden>
      <div class="panel">
        <h2 id="setupTitle" class="panel-title"></h2>
        <div id="setupRows" class="layers"></div>
        <p id="setupNote" class="panel-note"></p>
        <button id="setupTestAll" class="quiet"></button>
        <button id="setupClose" class="quiet"></button>
      </div>
    </div>

    <!-- Teaching it left from right has two doors — the robot's wheels, and a
         row in settings — so it is a sheet of its own rather than a panel
         inside one of them. -->
    <div id="calSheet" class="sheet" hidden>
      <div class="panel">
        <div id="cal" class="cal"></div>
      </div>
    </div>

    <!-- The sheet is its own backdrop: a click that lands on it rather than on
         the panel inside is a click outside, and closes it. -->
    <div id="sheet" class="sheet" hidden>
      <div class="panel">
        <h2 id="settingsTitle" class="panel-title"></h2>
        <div id="settingsRows" class="settings"></div>
        <button id="sheetClose" class="quiet"></button>
      </div>
    </div>

  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
