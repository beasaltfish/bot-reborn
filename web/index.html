<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice robot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="title">Voice robot</h1>

    <!-- Spec §4.1 layer 2. Layer 1 says of itself that it is not a safety
         mechanism, layer 3 is passive and waits for a timeout, and layer 0 only
         means anything once JS is already dead — so while JS is alive and doing
         the wrong thing, this button is the only thing a person can do about
         it. The moment the car can be driven by speech, it has to exist.
         Sticky, the same shape as the bench: at the moment the car is about to
         get away, the button has to be where the eyes already are. -->
    <div class="stopbar">
      <button id="estop" class="danger" disabled>Emergency stop</button>
    </div>

    <p class="controls">
      <button id="start">Start listening</button>
      <button id="stop" disabled>Stop listening</button>
      <span id="state" class="state">asleep</span>
    </p>

    <p id="notice" class="notice" hidden></p>
    <p id="transcript" class="transcript"></p>
    <pre id="log" class="log"></pre>

    <hr>
    <p>
      <a href="setup.html">Connectivity test</a> ·
      <a href="bench.html">Calibration bench</a>
    </p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
